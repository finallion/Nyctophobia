plugins {
	id "architectury-plugin" version "3.4-SNAPSHOT"
	id "dev.architectury.loom" version "1.11-SNAPSHOT" apply false
}

architectury {
	minecraft = rootProject.minecraft_version
}

subprojects {
	apply plugin: "dev.architectury.loom"

	loom {
		silentMojangMappingsLicense()
	}

	dependencies {
		minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
		// Plain yarn collides with NeoForge on remap ("Mapping target name conflicts"); the patch
		// layer resolves those names. It stays even on the fabric module so both compile against the
		// same mappings.
		mappings loom.layered {
			mappings "net.fabricmc:yarn:${rootProject.yarn_mappings}"
			mappings "dev.architectury:yarn-mappings-patch-neoforge:${rootProject.yarn_mappings_patch_neoforge_version}"
		}
	}
}

allprojects {
	apply plugin: "java"
	apply plugin: "architectury-plugin"
	apply plugin: "maven-publish"

	base {
		archivesName = rootProject.archives_base_name
	}
	version = "${rootProject.mod_version}+mc${rootProject.minecraft_version}"
	group = rootProject.maven_group

	repositories {
		// TerraBlender publishes every loader variant here under com.github.glitchfiend.
		maven { url "https://maven.minecraftforge.net/" }
		maven { url "https://maven.neoforged.net/releases" }
	}

	tasks.withType(JavaCompile) {
		options.encoding = "UTF-8"
		options.release = 21
	}

	java {
		withSourcesJar()
	}
}
