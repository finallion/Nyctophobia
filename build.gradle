plugins {
	id "architectury-plugin" version "${architectury_plugin_version}"
	id "dev.architectury.loom" version "${loom_version}" apply false
	id "com.gradleup.shadow" version "${shadow_version}" apply false
}

architectury {
	minecraft = rootProject.minecraft_version
}

subprojects {
	apply plugin: "dev.architectury.loom"

	loom {
		silentMojangMappingsLicense()
		mixin {
			useLegacyMixinAp = true
		}
	}

	repositories {
		maven { url "https://maven.parchmentmc.org" }
	}

	dependencies {
		minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
		mappings loom.layered {
			officialMojangMappings()
			parchment("org.parchmentmc.data:parchment-1.21.11:2025.12.20@zip")
		}
	}
}

allprojects {
	apply plugin: "java"
	apply plugin: "architectury-plugin"
	apply plugin: "maven-publish"

	base {
		archivesName = rootProject.archives_base_name
	}
	version = "${rootProject.mod_version}+mc${rootProject.minecraft_version}"
	group = rootProject.maven_group

	repositories {
		// TerraBlender publishes every loader variant here under com.github.glitchfiend.
		maven { url "https://maven.minecraftforge.net/" }
		maven { url "https://maven.neoforged.net/releases" }
	}

	tasks.withType(JavaCompile) {
		options.encoding = "UTF-8"
		options.release = 21
	}

	java {
		withSourcesJar()
	}
}
