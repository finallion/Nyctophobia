dependencies {
	implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"

	// terrablender.api is identical in the fabric and neoforge artifacts, so common compiles against
	// one of them and each loader module ships its own at runtime.
	compileOnly "com.github.glitchfiend:TerraBlender-fabric:${rootProject.minecraft_version}-${rootProject.terrablender_version}"
	compileOnly "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
}

architectury {
	common(rootProject.enabled_platforms.split(","))
}

sourceSets {
	main {
		resources {
			srcDirs += ["src/generated/resources"]
			exclude ".cache/**"
		}
	}
}
